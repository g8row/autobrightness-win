name: Release

# Push a tag like v0.2.0 to build, attest and publish a release.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Runs the build and tests (third-party NuGet and MSBuild code) with a read-only token.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag $env:TAG is not vX.Y.Z" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test --project tests/AutoBrightness.Core.Tests -c Release

      - name: Publish and build installers
        shell: pwsh
        run: ./build/Build-Installers.ps1 -Version $env:VERSION -OutDir dist

      - name: Checksums
        shell: pwsh
        run: |
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works as well as Get-FileHash.
          $lines = Get-ChildItem dist/*.msi | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only the steps that need write access, and none that run code from the repository or its packages.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance with Sigstore
      attestations: write # store the attestation on GitHub
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.msi
            dist/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $notes = @"
          ## Install

          - ``AutoBrightness-$version-win-x64.msi``: most PCs
          - ``AutoBrightness-$version-win-arm64.msi``: Windows on ARM

          Run the installer. It installs for your user only (no administrator prompt) into ``%LOCALAPPDATA%\Programs\AutoBrightness``, adds a Start menu shortcut and starts the app. Newer versions upgrade in place; uninstall from Settings > Apps. Your settings and camera calibration in ``%LOCALAPPDATA%\AutoBrightness`` are kept.

          AutoBrightness needs Twinkle Tray running and a USB webcam that allows manual exposure.

          ## Verify this build

          Each installer was built from this tag by GitHub Actions and has a signed build provenance attestation:

          ``````
          gh attestation verify AutoBrightness-$version-win-x64.msi --repo $env:REPO --signer-workflow $env:REPO/.github/workflows/release.yml
          ``````

          SHA-256 checksums are in ``SHA256SUMS.txt``. The installer is not Authenticode-signed, so Windows SmartScreen may warn before it runs.
          "@
          $prerelease = if ($version.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:TAG dist/* --repo $env:REPO --title "AutoBrightness $version" --notes "$notes" --generate-notes --verify-tag @prerelease

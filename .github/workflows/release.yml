name: Release

# Push a tag like v0.2.0 to build, attest and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write     # create the release
  id-token: write     # sign the build provenance with Sigstore
  attestations: write # store the attestation on GitHub

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag ${{ github.ref_name }} is not vX.Y.Z" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test --project tests/AutoBrightness.Core.Tests -c Release

      - name: Publish and build installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            $rid = "win-$arch"
            dotnet publish src/AutoBrightness.App -c Release -r $rid --self-contained true `
              -p:Version=$env:VERSION -p:ContinuousIntegrationBuild=true -o "publish/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet build installer -c Release -p:InstallerPlatform=$arch -p:Version=$env:VERSION `
              -p:PublishDir="$PWD/publish/$rid/" -o "msi/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Copy-Item "msi/$rid/AutoBrightness.msi" "dist/AutoBrightness-$env:VERSION-$rid.msi"
          }

      - name: Checksums
        shell: pwsh
        run: |
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works as well as Get-FileHash.
          $lines = Get-ChildItem dist/*.msi | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.msi

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $notes = @"
          ## Install

          - ``AutoBrightness-$env:VERSION-win-x64.msi``: most PCs
          - ``AutoBrightness-$env:VERSION-win-arm64.msi``: Windows on ARM

          Run the installer. It installs for your user only (no administrator prompt) into ``%LOCALAPPDATA%\Programs\AutoBrightness``, adds a Start menu shortcut and starts the app. Newer versions upgrade in place; uninstall from Settings > Apps. Your settings and camera calibration in ``%LOCALAPPDATA%\AutoBrightness`` are kept.

          AutoBrightness needs Twinkle Tray running and a USB webcam that allows manual exposure.

          ## Verify this build

          Each installer was built from this tag by GitHub Actions and has a signed build provenance attestation:

          ``````
          gh attestation verify AutoBrightness-$env:VERSION-win-x64.msi --repo $repo
          ``````

          SHA-256 checksums are in ``SHA256SUMS.txt``. The installer is not Authenticode-signed, so Windows SmartScreen may warn before it runs.
          "@
          gh release create '${{ github.ref_name }}' dist/* --repo $repo --title "AutoBrightness $env:VERSION" --notes "$notes" --generate-notes --verify-tag

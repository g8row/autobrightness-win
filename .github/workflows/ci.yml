name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build AutoBrightness.slnx -c Release

      - name: Test
        run: dotnet test --project tests/AutoBrightness.Core.Tests -c Release --no-build

      - name: Build installer
        shell: pwsh
        run: |
          dotnet publish src/AutoBrightness.App -c Release -r win-x64 --self-contained true -o publish/win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build installer -c Release -p:InstallerPlatform=x64 -p:PublishDir="$PWD/publish/win-x64/" -o msi

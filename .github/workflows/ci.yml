name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build AutoBrightness.slnx -c Release

      - name: Test
        run: dotnet test --project tests/AutoBrightness.Core.Tests -c Release --no-build

      # Both architectures, so a packaging mistake shows up before a release does.
      - name: Build installers
        shell: pwsh
        run: ./build/Build-Installers.ps1 -OutDir msi-out
